<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Staff Software Engineer and lover of all things cute, dainty, and adorablycreepy.">

<title>Page not found &mdash; Jocelyn Harper</title>

<!-- Emoji favicon — zero requests -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✿</text></svg>">

<!-- Theme: apply before paint to avoid flash -->
<script>
  (function(){
    var t=localStorage.getItem('petal-theme');
    var p=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
    document.documentElement.setAttribute('data-theme',t||p);
  })();
</script>

<link rel="stylesheet" href="/assets/css/style.css">

</head>
<body>

  <header class="site-header">
  <a class="site-title" href="/">Jocelyn Harper</a>
  <div class="site-nav-wrap">
    <nav class="site-nav" aria-label="Main navigation">
      
        <a href="/about/"
           >
          About
        </a>
      
        <a href="/projects/"
           >
          Projects
        </a>
      
        <a href="/"
           >
          Writing
        </a>
      
        <a href="https://github.com/javawitch"
           >
          GitHub
        </a>
      
    </nav>
    <div class="nav-divider" aria-hidden="true"></div>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
      <div class="toggle-dot"></div>
      <span class="toggle-txt">light</span>
    </button>
  </div>
</header>




  <div class="site-wrapper">
    <div class="border-strip" aria-hidden="true"></div>

    <div class="site-content">
      <main class="page-main" id="main-content">
        <style>
  .error-hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 4rem 1.75rem 3rem;
    gap: 0;
  }

  /* Large 404 display number */
  .error-404 {
    font-family: var(--font-serif);
    font-size: clamp(72px, 18vw, 120px);
    line-height: 1;
    color: var(--accent);
    letter-spacing: -0.04em;
    margin-bottom: 0.25rem;
    position: relative;
  }

  /* The middle zero gets a flower stamped inside it */
  .error-404 .zero {
    display: inline-block;
    position: relative;
  }

  .error-404 .zero::after {
    content: '✿';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 0.32em;
    color: var(--flower);
    line-height: 1;
  }

  .error-tagline {
    font-family: var(--font-serif);
    font-size: 1.4rem;
    color: var(--ink);
    margin-bottom: 0.6rem;
  }

  .error-sub {
    font-size: 0.8rem;
    color: var(--ink-muted);
    line-height: 1.8;
    max-width: 340px;
    margin-bottom: 2rem;
  }

  .error-actions {
    display: flex;
    gap: 0.6rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  .error-btn {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.6rem 1.25rem;
    text-decoration: none;
    border: 1.5px solid var(--ink);
    color: var(--ink);
    background: var(--bg);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background 0.2s, color 0.2s;
  }

  .error-btn::before {
    content: '✿';
    font-size: 0.7em;
    color: var(--accent);
  }

  .error-btn:hover {
    text-decoration: none;
    background: var(--ink);
    color: var(--bg);
  }

  .error-btn.primary {
    background: var(--ink);
    color: var(--bg);
  }

  .error-btn.primary::before {
    color: var(--flower);
  }

  .error-btn.primary:hover {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-text);
  }
</style>

<div class="error-hero">
  <p class="error-404">4<span class="zero">0</span>4</p>
  <p class="error-tagline">lost in the garden.</p>
  <p class="error-sub">
    This page wandered off and we can&rsquo;t find it anywhere.
    Maybe it&rsquo;s hiding behind a flower?
  </p>
  <div class="error-actions">
    <a class="error-btn primary" href="/">← go home</a>
    <a class="error-btn" href="/archive/">all posts</a>
  </div>
</div>

      </main>

      <footer class="site-footer">
        <span class="footer-accent">http://localhost:4000</span>
        <span>made with ♥ &amp; jekyll</span>
      </footer>
    </div>

    <div class="border-strip" aria-hidden="true"></div>
  </div>

  <script src="/assets/js/petal.js"></script>
</body>
</html>
