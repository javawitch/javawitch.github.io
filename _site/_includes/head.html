<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{ page.description | default: site.description }}">

<title>{% if page.title %}{{ page.title }} &mdash; {% endif %}{{ site.title }}</title>

<!-- Emoji favicon — zero requests -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✿</text></svg>">

<!-- Theme: apply before paint to avoid flash -->
<script>
  (function(){
    var t=localStorage.getItem('petal-theme');
    var p=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
    document.documentElement.setAttribute('data-theme',t||p);
  })();
</script>

<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
