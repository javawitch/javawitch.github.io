<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}" data-theme="light">
<head>
  {% include head.html %}
</head>
<body>

  {% include header.html %}

  <div class="site-wrapper">
    <div class="border-strip" aria-hidden="true"></div>

    <div class="site-content">
      <main class="page-main" id="main-content">
        {{ content }}
      </main>

      <footer class="site-footer">
        <span class="footer-accent">{{ site.url | remove: 'https://' }}</span>
        <span>made with jekyll on github pages</span>
      </footer>
    </div>

    <div class="border-strip" aria-hidden="true"></div>
  </div>

  <script src="{{ '/assets/js/petal.js' | relative_url }}"></script>
</body>
</html>
