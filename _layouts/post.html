---
layout: default
---

<article>
  <header class="post-header">
    {% if page.categories %}
    <p class="post-categories">
      · {% for cat in page.categories %}{{ cat }}{% unless forloop.last %} · {% endunless %}{% endfor %} ·
    </p>
    {% endif %}

    <h1 class="post-title">{{ page.title }}</h1>

    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">
        {{ page.date | date: "%B %-d, %Y" }}
      </time>
      {% if page.author %} &mdash; {{ page.author }}{% endif %}
    </p>
  </header>

  <div class="post-content">
    {{ content }}
  </div>
</article>
