# ── PETAL THEME — _config.yml ───────────────────────────────
# Replace these values with your own

title:       Jocelyn Harper
description: Staff Software Engineer and lover of all things cute, dainty, and adorablycreepy.
url:         https://jocelyn.dev
lang:        en

# GitHub Pages uses minima by default — override with remote_theme
# or drop these files directly into your repo root
# remote_theme: yourname/petal-theme  # if published as a gem/remote theme

# ── NAVIGATION ──────────────────────────────────────────────
nav:
  - title: About
    url:   /about/
  - title: Projects
    url:   /projects/
  - title: Writing
    url:   /
  - title: GitHub
    url:   https://github.com/javawitch

# ── SUBBAR (optional) ───────────────────────────────────────
subbar:
  - title: Favorites
    url:   /favorites/
  - title: TIL
    url:   /til/
  - title: Zines
    url:   /zines/
  - title: RSS
    url:   /feed.xml

# ── JEKYLL SETTINGS ─────────────────────────────────────────
permalink:    /:year/:month/:title/
markdown:     kramdown
highlighter:  rouge

kramdown:
  input:         GFM
  syntax_highlighter: rouge

# Strip whitespace from HTML output (free perf win)
compress_html:
  clippings: all

# Exclude dev files from build
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - "*.sh"
