- title: "Witch Gems VSCode Theme"
  description: "A VSCode theme that were inspired by the colors that I used for Git Cute Podcast's logo at the time. I wanted to create a theme that that was dark and cute and carried over my love for witchy aesthetics into my coding environment. The theme is open source and is available on VSCode marketplace with over 2k installs."
  year: 2025
  type: Open Source
  url: https://github.com/javawitch/witchgems-theme
 # image: /assets/img/witchgems.png
  featured: true
  tags:
