- title: "Petal — a lightweight Jekyll theme"
  description: "Design inspiration came from Frieren's favorite spell and Ariana Grande's upcoming album. Built this site's theme from scratch when I couldn't find any themes that were lightweight enough for Github Pages and gave me the customization for a portfolio. Requirements: No heavy frameworks, meaning pure CSS, JS, light/dark mode toggle, and no unnecessary images to stay within Github Pages constraints."
  year: 2026
  type: Open Source
  url: https://github.com/javawitch/javawitch.github.io
  show_placeholder: true
  tags:
    - Jekyll
    - SCSS
    - CSS
    - JS
